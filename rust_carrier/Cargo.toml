[package]
name = "rust_carrier"
version = "0.1.0"
edition = "2021"
authors = ["Aman Sahani <amansahani@users.noreply.github.com>"]
description = "Ultra-low latency, SIMD-accelerated omni-channel voice carrier & agent engine"

[dependencies]
tokio = { version = "1.40", features = ["full", "parking_lot"] }
axum = { version = "0.7", features = ["tokio", "http2", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "http2"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1.7"
base64 = "0.22"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
parking_lot = "0.12"
async-trait = "0.1"
quinn = "0.11.12"
rustls = "0.23.45"
rcgen = "0.14.10"
tokio-util = "0.7.19"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true
